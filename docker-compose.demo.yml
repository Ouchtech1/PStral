services:
  ollama:
    image: ollama/ollama:0.33.3
    container_name: pstral-demo-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/unsloth/Qwen3.5-2B-GGUF:Q4_K_M}
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
    volumes:
      - ollama-demo-data:/root/.ollama
    mem_limit: 2600m
    cpus: "1.5"
    networks:
      - pstral-demo
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pstral-demo-backend
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/unsloth/Qwen3.5-2B-GGUF:Q4_K_M}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_THREADS: ${OLLAMA_NUM_THREADS:-2}
      DEMO_PROFILE: ${DEMO_PROFILE:-synthetic}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.demo}
      DATA_DIR: /app/data
      DOCUMENTS_DIR: /app/app/demo_assets/documents
      SQL_CATALOG_PATH: /app/app/demo_assets/sql/catalog.json
      BACKEND_CORS_ORIGINS: '["http://localhost"]'
    volumes:
      - pstral-demo-data:/app/data
      - ./backend/app/demo_assets:/app/app/demo_assets:ro
    depends_on:
      ollama:
        condition: service_healthy
    mem_limit: 512m
    cpus: "0.35"
    networks:
      - pstral-demo
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api/v1
    container_name: pstral-demo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 128m
    cpus: "0.15"
    networks:
      - pstral-demo

networks:
  pstral-demo:
    driver: bridge

volumes:
  ollama-demo-data:
  pstral-demo-data:
